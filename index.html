<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Q2 Skills Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">

    <style>
        body{
            background-color: pink;
            
        }
        
        .container{ 
            color: black;
            border-radius: 10px;
            background-color: #ffffff;
            padding-bottom: 20px;
            margin: auto;
            margin-top: 10%;
            margin-bottom: 10%;
            width: 50%;
            box-shadow: 5px 5px 15px 5px rgba(0,0,0,0.52);
        }

        #header{
            color: #000000;
            border-top-right-radius: 10px;
            border-top-left-radius: 10px;
            padding-top: 20px;
            text-align: center;
            background-color: rgb(244, 121, 199);
            padding: 20px;
        }

        #example{
            background-color: #f3c4e071;
            padding: 10px;
            border-radius: 5px;
            color: rgb(67, 66, 66);
        }

        #form{
            display: inline-block;
            text-align: left;
        }

        .button {
            background-color: rgb(236, 172, 226);
            color: white;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 300px;
        }


        .btn{
            display: block;
            width: 100%;
            border-radius: 5px;
            background-color:  rgb(244, 121, 199);
            color: #ffc7e7;
            font-weight: bold;
            height: 50px;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="row" id="header">
            <div class="col-lg-12">
                <h1>Non-Metal Elements</h1>
                <h5>Periodic Table Information Finder</h5>
            </div>
        </div>

        <br>

        <div class="col" id="form">

            <div id="example">
                <h5><b>Instructions:</b></h5>
                <p>Enter the <b>symbol</b> of a non-metal element
                <br>
                (Example: H, O, Xe)</p>
            </div>

            <br>
        
            <form>
                <label for="nonmetals">Element Symbol:</label>
                <br>
                <input type="text" id="nonmetals" class="form-control">
                <br>
                <button type="button" class="btn" py-click="check_element">CHECK</button>
            </form>

        <br><br>

            <h5>Result:</h5>
                <div id="elements"></div>
        </div>
    </div>
    <script type="py" src="main.py"></script>
</body>
</html>
